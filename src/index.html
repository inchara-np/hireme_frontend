  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Fonts: connect early so the display face is not the render blocker. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">

    "inLanguage": "en-IN"
  }
  </script>

  <!-- Apply the saved theme before first paint so dark-mode visitors never
       see a white flash. Kept inline and tiny; the CSP allows it via the
       matching hash in public/_headers. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'dark' && t !== 'light') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.add(t + '-theme');
      } catch (e) {
        document.documentElement.classList.add('light-theme');
      }
    })();
  </script>
</head>
