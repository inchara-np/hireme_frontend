<section class="page-header" [class.page-header--inverse]="tone === 'inverse'">
  <div class="page-header__glow" aria-hidden="true"></div>
  <div class="container page-header__inner">
    @if (kicker) {
      <p class="kicker page-header__kicker">{{ kicker }}</p>
    }
    <h1>{{ title }}</h1>
    @if (subtitle) {
      <p class="page-header__subtitle">{{ subtitle }}</p>
    }
    <ng-content />
  </div>
</section>
