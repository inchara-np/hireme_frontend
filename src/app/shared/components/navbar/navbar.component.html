<header class="nav" [class.nav--scrolled]="scrolled()" [class.nav--open]="menuOpen()">
  <div class="nav__inner">

    <a routerLink="/" class="brand" aria-label="Valahatti Technologies — home">
      <img
        src="logo.png"
        alt=""
        class="brand__mark"
        width="40"
        height="40"
        fetchpriority="high"
      >
      <span class="brand__text">
        <span class="brand__name">Valahatti</span>
        <span class="brand__sub">Technologies</span>
      </span>
    </a>

    <nav class="nav__links" id="primary-navigation" aria-label="Primary">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: !!item.exact }"
          class="nav__link"
        >{{ item.label }}</a>
      }
    </nav>

    <div class="nav__actions">
      <app-theme-toggle />
      <a routerLink="/contact" class="btn btn-accent btn-sm nav__cta">Get a quote</a>

      <button
        type="button"
        class="nav__toggle"
        [class.is-open]="menuOpen()"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="primary-navigation"
        [attr.aria-label]="menuOpen() ? 'Close navigation menu' : 'Open navigation menu'"
      >
        <span class="nav__toggle-bar"></span>
        <span class="nav__toggle-bar"></span>
        <span class="nav__toggle-bar"></span>
      </button>
    </div>
  </div>
</header>

@if (menuOpen()) {
  <div class="nav__scrim" (click)="closeMenu()" aria-hidden="true"></div>
}
